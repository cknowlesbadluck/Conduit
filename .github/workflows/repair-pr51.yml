name: Repair Conduit PR 51

on:
  push:
    branches:
      - conduit-release-0.7.1-9358966330171302683

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conduit-release-0.7.1-9358966330171302683
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Repair authorization and runtime blockers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/mcp.ts')
          s = p.read_text()
          s = s.replace(
              'await enforceExternalCapability({ agentId: agentId ?? undefined, provider, method, path: sanitizeForLog(path), projectId });',
              'await enforceExternalCapability({ agentId: agentId ?? undefined, provider, method, path, projectId });',
          )
          p.write_text(s)

          p = Path('src/index.ts')
          s = p.read_text()
          marker = "\nif (typeof process !== 'undefined' && process.versions?.node && !process.env.CLOUDFLARE_WORKER) {"
          if marker in s:
              s = s.split(marker)[0] + '\n\nboot().catch((error) => { console.error("Conduit startup failed", error); process.exit(1); });\nexport default app;\n'
          p.write_text(s)

          wrangler = Path('wrangler.json')
          if wrangler.exists():
              wrangler.unlink()
          PY

      - name: Verify
        run: npm ci && npm test

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mcp.ts src/index.ts wrangler.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: preserve raw authorization paths and remove broken worker adapter'
          git push origin HEAD:conduit-release-0.7.1-9358966330171302683
