name: Conduit v0.8 compatibility repair

on:
  push:
    branches: [conduit-v0.8-development]

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conduit-v0.8-development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable legacy MCP transport compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()
          s = s.replace('createMcpHandler(() => createConduitServer(authConfig))', 'createMcpHandler(() => createConduitServer(authConfig), { legacy: "stateless" })')
          s = s.replace('createMcpHandler(() => createConduitServer())', 'createMcpHandler(() => createConduitServer(), { legacy: "stateless" })')
          p.write_text(s)
          PY
          rm .github/workflows/conduit-v08-compat-fix.yml
          npm ci
          npm run typecheck
          npm test
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts .github/workflows/conduit-v08-compat-fix.yml
          git commit -m 'fix: enable legacy MCP transport compatibility'
          git push origin conduit-v0.8-development
