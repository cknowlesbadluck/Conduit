name: Portfolio health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/portfolio-report.mjs"
      - "scripts/portfolio-report.test.mjs"
      - ".github/workflows/portfolio-health.yml"
  pull_request:
    paths:
      - "scripts/portfolio-report.mjs"
      - "scripts/portfolio-report.test.mjs"
      - ".github/workflows/portfolio-health.yml"

permissions:
  contents: read

concurrency:
  group: portfolio-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Generate read-only portfolio report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/portfolio-report.mjs | tee portfolio-health.md | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-health-${{ github.sha }}
          path: portfolio-health.md
          retention-days: 14
          if-no-files-found: ignore
