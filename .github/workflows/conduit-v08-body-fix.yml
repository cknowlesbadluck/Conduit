name: Conduit v0.8 body forwarding repair

on:
  push:
    branches: [conduit-v0.8-development]

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: conduit-v0.8-development
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repair production MCP adapter wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/index.ts')
          s = p.read_text()
          old = 'toNodeHandler(handler, { onerror: console.error })'
          new = '((req, res) => toNodeHandler(handler, { onerror: console.error })(req, res, req.body))'
          if old not in s:
              raise SystemExit('expected MCP Node adapter wiring was not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
          rm .github/workflows/conduit-v08-body-fix.yml
          npm ci
          npm run typecheck
          npm test
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/index.ts .github/workflows/conduit-v08-body-fix.yml
          git commit -m 'fix: forward parsed MCP body to production Node adapter'
          git push origin conduit-v0.8-development
