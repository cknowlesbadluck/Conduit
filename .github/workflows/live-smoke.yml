name: Live Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONDUIT_URL: ${{ vars.CONDUIT_URL || 'https://conduit-feco.onrender.com' }}
      MCP_RESOURCE: ${{ vars.MCP_RESOURCE || 'https://conduit-feco.onrender.com/mcp' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify public production endpoints
        run: node scripts/verify-production.mjs
      - name: Verify service health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$CONDUIT_URL/health" | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

      - name: Verify readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$CONDUIT_URL/ready" | tee /tmp/ready.json
          grep -q '"status":"ready"' /tmp/ready.json

      - name: Verify protected-resource metadata parity
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$CONDUIT_URL/.well-known/oauth-protected-resource" | tee /tmp/resource-root.json
          curl --fail --silent --show-error --max-time 30 "$CONDUIT_URL/.well-known/oauth-protected-resource/mcp" | tee /tmp/resource-path.json
          python - <<'PY'
          import json
          root = json.load(open('/tmp/resource-root.json', encoding='utf-8'))
          path = json.load(open('/tmp/resource-path.json', encoding='utf-8'))
          assert root == path, (root, path)
          assert root['resource'] == __import__('os').environ['MCP_RESOURCE'], root
          assert root['authorization_servers'], root
          scopes = root.get('scopes_supported', [])
          assert 'mcp:conduit.read' in scopes, root
          assert 'mcp:conduit.write' in scopes, root
          assert 'header' in root.get('bearer_methods_supported', []), root
          print('Protected-resource metadata:', json.dumps(root, indent=2))
          PY

      - name: Verify MCP requires OAuth
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 30 -D /tmp/mcp.headers -o /tmp/mcp.json -w '%{http_code}' -X POST "$CONDUIT_URL/mcp" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"live-smoke","version":"1.0.0"}}}')
          test "$status" = "401"
          grep -qi '^www-authenticate:.*Bearer' /tmp/mcp.headers
          grep -qi '^www-authenticate:.*resource_metadata' /tmp/mcp.headers

      - name: Verify authorization-server metadata and registration interoperability
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$CONDUIT_URL/.well-known/oauth-authorization-server" | tee /tmp/as.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/as.json', encoding='utf-8'))
          prm = json.load(open('/tmp/resource-root.json', encoding='utf-8'))
          for key in ('issuer', 'jwks_uri', 'authorization_endpoint', 'token_endpoint'):
              assert data.get(key), (key, data)
          assert data['issuer'] in prm['authorization_servers'], (data, prm)
          for key in ('issuer', 'jwks_uri', 'authorization_endpoint', 'token_endpoint'):
              assert data[key].startswith('https://'), (key, data[key])
          methods = data.get('code_challenge_methods_supported') or []
          assert 'S256' in methods, data
          dcr = bool(data.get('registration_endpoint'))
          cimd = data.get('client_id_metadata_document_supported') is True
          assert dcr or cimd, {
              'error': 'no_mcp_client_registration_method_advertised',
              'registration_endpoint': data.get('registration_endpoint'),
              'client_id_metadata_document_supported': data.get('client_id_metadata_document_supported'),
          }
          print('AS issuer:', data['issuer'])
          print('DCR:', dcr)
          print('CIMD:', cimd)
          PY

      - name: Verify authenticated event stream is protected
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 30 -D /tmp/events.headers -o /tmp/events.json -w '%{http_code}' "$CONDUIT_URL/events")
          test "$status" = "401"
          grep -qi '^www-authenticate:.*Bearer' /tmp/events.headers
