name: Live Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CONDUIT_URL: https://conduit-feco.onrender.com
      MCP_RESOURCE: https://conduit-feco.onrender.com/mcp
      DESCOPE_DISCOVERY: https://api.descope.com/v1/apps/agentic/P3HwLMKYYNbXzGbsRNPW9QRkXk27/MS3JD96awFEicI9nXypa53EaVmKKA/.well-known/openid-configuration
    steps:
      - name: Verify service health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$CONDUIT_URL/health" | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json

      - name: Verify readiness
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$CONDUIT_URL/ready" | tee /tmp/ready.json
          grep -q '"status":"ready"' /tmp/ready.json

      - name: Verify protected-resource metadata parity
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "$CONDUIT_URL/.well-known/oauth-protected-resource" | tee /tmp/resource-root.json
          curl --fail --silent --show-error --max-time 30 \
            "$CONDUIT_URL/.well-known/oauth-protected-resource/mcp" | tee /tmp/resource-path.json
          python - <<'PY'
          import json
          with open('/tmp/resource-root.json', encoding='utf-8') as f:
              root = json.load(f)
          with open('/tmp/resource-path.json', encoding='utf-8') as f:
              path = json.load(f)
          assert root == path, (root, path)
          assert root['resource'] == 'https://conduit-feco.onrender.com/mcp', root
          assert root['authorization_servers'], root
          scopes = root.get('scopes_supported', [])
          assert 'mcp:conduit.read' in scopes, root
          assert 'mcp:conduit.write' in scopes, root
          assert 'header' in root.get('bearer_methods_supported', []), root
          print('Protected-resource metadata (identical root + path):', json.dumps(root, indent=2))
          PY

      - name: Verify MCP requires OAuth
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 30 -D /tmp/mcp.headers -o /tmp/mcp.json -w '%{http_code}' \
            -X POST "$CONDUIT_URL/mcp" \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"live-smoke","version":"1.0.0"}}}')
          test "$status" = "401"
          grep -qi '^www-authenticate:.*Bearer' /tmp/mcp.headers

      - name: Verify Descope discovery and registration surface
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 "$DESCOPE_DISCOVERY" | tee /tmp/descope.json
          curl --fail --silent --show-error --max-time 30 \
            "$CONDUIT_URL/.well-known/oauth-authorization-server" | tee /tmp/as.json
          python - <<'PY'
          import json
          with open('/tmp/descope.json', encoding='utf-8') as f:
              data = json.load(f)
          for key in ('issuer', 'jwks_uri', 'authorization_endpoint', 'token_endpoint'):
              assert data.get(key), (key, data)
          with open('/tmp/as.json', encoding='utf-8') as f:
              as_meta = json.load(f)
          assert as_meta.get('registration_endpoint'), as_meta
          assert 'S256' in as_meta.get('code_challenge_methods_supported', []), as_meta
          print('Descope issuer:', data['issuer'])
          print('registration_endpoint:', as_meta['registration_endpoint'])
          print('client_id_metadata_document_supported:', as_meta.get('client_id_metadata_document_supported'))
          PY

      - name: Verify service advertises OAuth on unauthorized MCP response
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 30 -D /tmp/mcp.headers -o /dev/null -w '%{http_code}' \
            -X POST "$CONDUIT_URL/mcp" \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"live-smoke","version":"1.0.0"}}}')
          test "$status" = "401"
          cat /tmp/mcp.headers
          grep -qi '^www-authenticate:.*resource_metadata' /tmp/mcp.headers
