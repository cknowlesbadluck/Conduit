name: portfolio-probe (report-only)

# Innovate I1: timestamped, report-only live evidence. Never gates anything:
# - no pull_request/push trigger, so it can never turn a PR or main red
# - continue-on-error + `|| true`: an outage is reported in the summary, not as a failed check
# - read-only token, no secrets, gentle cadence (4x/day, 6 GETs per run) to avoid CDN challenges
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Probe (report-only)
        run: |
          node scripts/portfolio-probe.mjs --json > probe.json || true
          node scripts/portfolio-probe.mjs --summary probe.json >> "$GITHUB_STEP_SUMMARY" || true
