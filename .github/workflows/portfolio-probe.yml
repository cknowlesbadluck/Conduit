name: portfolio-probe (report-only)

# Re-adds #219's scheduled probe (the file never landed on main). Report-only by design:
# - schedule/workflow_dispatch only: no pull_request/push trigger, so it can never gate a PR or main
# - continue-on-error + `|| true`: an outage shows up in the job summary, not as a failed check
# - read-only token, no secrets, persist-credentials: false, SHA-pinned actions
# - runs the existing scripts/portfolio-probe.mjs unchanged (6 unauthenticated GETs per run)
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Probe (report-only)
        # One probe run (6 GETs); the table and JSON in the summary come from the same snapshot.
        run: |
          node scripts/portfolio-probe.mjs --json > probe.json || true
          node -e '
            const fs = require("fs");
            let r; try { r = JSON.parse(fs.readFileSync("probe.json", "utf8")); } catch { r = null; }
            // Response-controlled text (version, reason, missing names) must not break the table or inject markup.
            const cell = (v) => String(v ?? "").replace(/[\r\n]+/g, " ").replace(/[|`<>\\]/g, (c) => "&#" + c.charCodeAt(0) + ";").slice(0, 120);
            const out = [];
            if (!r || !Array.isArray(r.results)) {
              out.push("## Portfolio probe", "", "Probe produced no parseable JSON (report-only; not a failure).");
            } else {
              out.push(`## Portfolio probe (${cell(r.at)})`, "", "| | target | outcome | status | detail |", "|---|---|---|---|---|");
              for (const x of r.results) {
                const detail = Array.isArray(x.missing) ? `missing=[${x.missing.join(",")}]` : (x.reason ?? x.version ?? "");
                out.push(`| ${x.ok === true ? "OK" : "FAIL"} | ${cell(x.name)} | ${cell(x.outcome)} | ${cell(x.status)} | ${cell(detail)} |`);
              }
              out.push("", "<details><summary>JSON</summary>", "", "```json", JSON.stringify(r, null, 2).replace(/```/g, "` ` `"), "```", "</details>");
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          ' || true
