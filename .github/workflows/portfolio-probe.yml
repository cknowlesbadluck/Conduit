name: portfolio-probe (report-only)

# Re-adds #219's scheduled probe (the file never landed on main). Report-only by design:
# - schedule/workflow_dispatch only: no pull_request/push trigger, so it can never gate a PR or main
# - continue-on-error + `|| true`: an outage shows up in the job summary, not as a failed check
# - read-only token, no secrets, persist-credentials: false, SHA-pinned actions
# - runs the existing scripts/portfolio-probe.mjs unchanged (6 unauthenticated GETs per run)
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Probe (report-only)
        run: |
          {
            echo "## Portfolio probe ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
            echo '```'
            node scripts/portfolio-probe.mjs || true
            echo '```'
            echo '<details><summary>JSON</summary>'
            echo
            echo '```json'
            node scripts/portfolio-probe.mjs --json || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
