name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CONDUIT_TEST_MEMORY: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Coverage gate pinned just under the current baseline (Node 22: lines 65.4, branches 75.2, functions 67.9).
      # Raise these when coverage improves; never lower them to make a PR pass.
      - run: npm run test:coverage
      - run: npm run build

  postgres-coordination:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: conduit
          POSTGRES_PASSWORD: conduit
          POSTGRES_DB: conduit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conduit -d conduit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://conduit:conduit@localhost:5432/conduit_test
      DATABASE_SSL: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - name: Run coordination concurrency tests against Postgres
        run: |
          npm run compile
          node --test --test-concurrency=1 dist/coordination.test.js dist/store.lifecycle.test.js dist/store.coverage.test.js dist/task-recovery.postgres.test.js
